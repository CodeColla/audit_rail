# Audit Rail — UI service (static SPA served by nginx).
#
#   ./_docker/scripts/service_ctl.sh up 2
#   # or directly:
#   docker compose -f _docker/compose/audit-rail-ui.compose.yml up -d
#
# The image carries no Node process. API_URL in env/ui.env is read at CONTAINER START by
# _docker/ui/entrypoint.sh and written as nginx config — not baked into the bundle — so the
# same image works against any backend: change the value in Portainer, restart, done.
#
# The network is EXTERNAL and shared with the API, which is what lets API_URL name the API
# container directly (http://audit-rail-api:5007). Create it once per host:
#
#     docker network create audit-rail
services:
  audit-rail-ui:
    build:
      context: ../..
      dockerfile: _docker/dockerfile/audit-rail-ui.Dockerfile
    image: audit-rail-ui
    container_name: audit-rail-ui
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
    ports:
      - "8080:80"
    env_file:
      - ../env/ui.env
    networks:
      - audit-rail

networks:
  audit-rail:
    external: true
