# Audit Rail — API service.
#
#   ./_docker/scripts/service_ctl.sh up 1
#   # or directly:
#   docker compose -f _docker/compose/audit-rail-api.compose.yml up -d
#
# The API and the UI are SEPARATE compose files on purpose: they are routinely deployed to
# different servers, so on each one you bring up only what belongs there. There is deliberately
# no database service here — Postgres is yours, already running; point DATABASE_URL at it and
# apply _docker/host.sql once. (audit-rail-postgres.compose.yml is the LOCAL DEV database and
# is a different thing entirely.)
#
# The network is EXTERNAL and shared with the UI, so the UI container can reach this one by
# name. Create it once per host:
#
#     docker network create audit-rail
#
# Without that, each compose file would get its own project-namespaced bridge and the hostname
# `audit-rail-api` would not resolve from the UI container.
services:
  audit-rail-api:
    build:
      # Context is the REPO ROOT: the image needs api/, db/ and scripts/. .dockerignore is
      # what keeps that context small.
      context: ../..
      dockerfile: _docker/dockerfile/audit-rail-api.Dockerfile
    image: audit-rail-api
    container_name: audit-rail-api
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
    ports:
      - "5007:5007"
    env_file:
      - ./env/api.env
    # READ THIS BEFORE YOUR FIRST REDEPLOY.
    #
    # The Dockerfile declares VOLUME ["/data/vault"], and there is no volume named here — so
    # Docker allocates an ANONYMOUS one. Recreating the container (any `up -d` after a rebuild)
    # gives it a FRESH vault: the old one is orphaned rather than deleted, and the UI then
    # lists evidence that 410s when clicked, because the `files` rows survive while the blobs
    # they point at are in a volume nothing mounts any more.
    #
    # The vault holds every uploaded file — evidence, policy documents, asset photos, signed
    # PDFs, org logos. Uncomment one of these before you put real data in:
    #
    volumes:
    #   - audit_rail_vault:/data/vault        # named volume (also add the top-level `volumes:` key)
     - /tank/audit-rail/vault:/data/vault   # host path — easier to back up
    networks:
      - audit-rail

networks:
  audit-rail:
    external: true
