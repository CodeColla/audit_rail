server {
  listen 80;

  server_name localhost;

  root /usr/share/nginx/html;

  index index.html;

  location / {
    try_files $uri /index.html;
  }

  # Vite content-hashes asset filenames, so a cached index.html points at JavaScript that no
  # longer exists after the next deploy and the page opens blank. The file is small and the
  # assets below are what actually needs caching.
  location = /index.html {
    add_header Cache-Control "no-store";
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public";
  }
}
