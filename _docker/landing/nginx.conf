server {
  listen 80;

  server_name localhost;

  root /usr/share/nginx/html;

  index index.html;

  # Phase 10: clean URLs for the legal pages (/terms, /privacy, /refund, /contact) — Vite
  # builds them as terms.html etc. (see vite.config.ts), and this drops the extension before
  # falling back to the SPA shell for everything else.
  location / {
    try_files $uri $uri.html /index.html;
  }

  # Vite content-hashes asset filenames, so a cached HTML page can point at JavaScript that no
  # longer exists after the next deploy and open blank (or stale). Every top-level HTML page —
  # index and the legal pages — must never be cached; the hashed files under /assets/ are what
  # actually needs caching.
  location ~ \.html$ {
    add_header Cache-Control "no-store";
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public";
  }
}
