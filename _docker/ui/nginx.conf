# Audit Rail — the UI container's own nginx. This sits BEHIND your infrastructure nginx; it
# only serves the built SPA (and, optionally, forwards /api — see the include below).

server {
    listen      80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Your proxy terminates TLS and sets these; nothing here should assume otherwise.
    absolute_redirect off;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml application/manifest+json;

    # Uploads pass through here ONLY if API_URL is set (see below). Sized for the app's real
    # limits — 25 MB evidence, 5 MB document images — because nginx defaults to 1 MB and every
    # upload path in the product is larger than that.
    client_max_body_size 30m;

    # OPTIONAL /api forwarding. `20-api-proxy.sh` writes a file here at container start, but
    # only when API_URL is set. A wildcard include that matches nothing is legal in nginx, so
    # with no API_URL this line does nothing at all and /api is left to the proxy in front.
    include /etc/nginx/api-proxy/*.conf;

    # index.html must never be cached. Asset filenames are content-hashed, so a stale
    # index.html points at JavaScript that no longer exists after the next deploy — the
    # classic "works for me, blank page for everyone else" failure.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    # …and the hashed assets are safe to cache for a year, precisely because they are hashed.
    location /assets/ {
        expires    1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
    }

    # The history fallback. The app is a BrowserRouter with no basename, so /sign/<token>,
    # /auditor?token=…, /documents/<id> and every */view/<id> deep link arrive as real GETs
    # for paths that do not exist on disk. try_files preserves the query string, which
    # /auditor?token= depends on. Without this, an emailed attestation link 404s and the
    # feature is dead with no symptom anywhere in the app.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
