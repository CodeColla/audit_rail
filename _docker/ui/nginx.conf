server {
  listen 80;

  server_name localhost;

  root /usr/share/nginx/html;

  index index.html;

  # Written at container start by entrypoint.sh, from API_URL. A GLOB on purpose: nginx treats
  # a missing include as fatal, but an include that matches nothing is fine — so leaving
  # API_URL unset simply means no /api block, and the reverse proxy in front handles it.
  include /etc/nginx/api-proxy/*.conf;

  location / {
    try_files $uri /index.html;
  }

  # Vite content-hashes asset filenames, so a cached index.html points at JavaScript that no
  # longer exists after the next deploy and the app opens to a blank page. The file is small
  # and the assets below are what actually needs caching.
  location = /index.html {
    add_header Cache-Control "no-store";
  }

  # Optional: cache static assets
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public";
  }
}
