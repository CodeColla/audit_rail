# audit_rail infrastructure.  Start:  docker compose up -d
#
# NOTE ON THE PORT: host 5434. Two other stacks on this machine already take the obvious
# ports — Probo's postgres holds 5432, and emp_erp_mcp holds 5433 (it also runs MinIO on
# 9000/9001). We were on 5433 and silently lost it to emp_erp_mcp whenever that stack came
# up first, so audit_rail owns 5434 and all three can run side by side. Inside the container
# Postgres still listens on 5432; only the host mapping differs. The app connects via .env:
#   DATABASE_URL=postgresql+psycopg://audit:audit@localhost:5434/audit_rail
services:
  postgres:
    image: postgres:16-alpine
    container_name: audit_rail_pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: audit
      POSTGRES_PASSWORD: audit
      POSTGRES_DB: audit_rail
      # deterministic collation so ORDER BY matches across machines
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "127.0.0.1:5434:5432"      # host 5434 -> container 5432
    volumes:
      - audit_rail_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audit -d audit_rail"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  audit_rail_pgdata:
