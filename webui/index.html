    <!-- P6. There was no favicon and no public/ directory at all: every browser tab showed a
         blank page icon, which is a small thing that reads loudly on a product. SVG first for
         browsers that take it (sharp at any size), .ico as the fallback, and the PNG for iOS
         home screens, which ignores both. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0E1A2B" />
