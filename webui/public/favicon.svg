  <!-- Audit Rail (P6-S6). "AR" is Inter Bold with its outlines BAKED AS PATHS, not a <text>
       element, and that is not a stylistic choice: this machine has no Inter installed
       (fc-match sans-serif -> DejaVu Sans), so a <text> favicon rasterises into the PNG icons
       in the fallback face while browsers show Inter — an icon set that does not match itself.
       The old SR favicon had exactly that flaw. Paths render identically everywhere.
       Letters fill 44 of the 64pt tile: at 36 they were unreadable at 16px, which is the only
       size a browser tab ever shows. Regenerate the PNGs from this file — see
       docs/phase6/04-brand-and-blank-db.md for the commands. -->
